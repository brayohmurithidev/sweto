services:
  postgres:
    image: postgres:16-alpine
    container_name: sweto-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      

    ports:
      - "5433:5432"

    volumes:
      - sweto_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sweto-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: 
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - sweto_redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  sweto_postgres_data:
  sweto_redis_data:
name: API

on:
  push:
    branches: [main]
    paths: ["sweto-api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["sweto-api/**", ".github/workflows/api.yml"]

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sweto
          POSTGRES_PASSWORD: sweto_dev_password
          POSTGRES_DB: sweto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sweto"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SWETO_TEST_DATABASE_URL: postgresql+asyncpg://sweto:sweto_dev_password@localhost:5432/sweto_test
    defaults:
      run:
        working-directory: sweto-api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sweto-api/uv.lock
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Configure test environment
        run: cp .env.example .env
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy app
      - name: Tests (unit + PostgreSQL integration)
        run: uv run pytest -q
      - name: Migrations have a single head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Models match migrations
        run: DATABASE_URL="$SWETO_TEST_DATABASE_URL" uv run alembic check
